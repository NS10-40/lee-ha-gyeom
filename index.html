<!doctype html>
<html lang="ko" class="dark"><head>
    

    <meta charset="UTF-8">

    <meta property="og:title" content="프레이밍 X-레이 &amp; 팩트 탈수기 · Framing X-Ray">
    <meta property="og:description" content="원문 속 감정 트리거와 모호한 출처를 실시간으로 탈수하고, 순수 팩트의 프레임 전환과 생략된 사각지대를 검증합니다.">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: dark;
        --bg-canvas: #0b1120;
        --bg-surface: #0f172a;
        --bg-sub: #0d1425;
        --bg-inset: #0b1120;
        --border: rgba(30, 41, 59, 0.95);
        --border-strong: rgba(51, 65, 85, 0.9);
        --text-100: #f1f5f9;
        --text-200: #e2e8f0;
        --text-300: #cbd5e1;
        --text-400: #94a3b8;
        --text-500: #64748b;
        --sky-200: #bae6fd;
        --sky-300: #7dd3fc;
        --sky-400: #38bdf8;
        --sky-500: #0ea5e9;
        --rose-100: #ffe4e6;
        --rose-200: #fecdd3;
        --rose-300: #fda4af;
        --rose-400: #fb7185;
        --rose-500: #f43f5e;
        --amber-100: #fef3c7;
        --amber-200: #fde68a;
        --amber-300: #fcd34d;
        --amber-400: #fbbf24;
        --amber-500: #f59e0b;
        --emerald-200: #a7f3d0;
        --emerald-300: #6ee7b7;
        --emerald-400: #34d399;
        --violet-200: #ddd6fe;
        --violet-300: #c4b5fd;
        --violet-400: #a78bfa;
        --font-sans: "Plus Jakarta Sans", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg-canvas);
        color: var(--text-100);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
      }

      button, input, textarea {
        font-family: inherit;
      }

      button {
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
        padding: 0;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
        outline: 2px solid var(--sky-400);
        outline-offset: 2px;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .font-mono, .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      .font-mono {
        font-family: var(--font-mono);
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.22); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.38); }

      /* Layout Shell */
      .app-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* TopBar (3-zone contract) */
      .topbar {
        height: 56px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-canvas);
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        flex-shrink: 0;
      }

      .brand-link {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text-100);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .topbar-nav {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .nav-tab {
        position: relative;
        padding: 8px 2px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-400);
        white-space: nowrap;
        flex-shrink: 0;
        transition: color 0.15s ease;
      }

      .nav-tab:hover { color: var(--text-200); }
      .nav-tab.is-active { color: var(--text-100); }
      .nav-tab.is-active::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -11px;
        height: 2px;
        background: var(--sky-400);
      }

      .nav-dot {
        width: 6px;
        height: 6px;
        border-radius: 2px;
        display: inline-block;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }

      .btn-secondary {
        background: #0f172a;
        border: 1px solid rgba(51, 65, 85, 0.85);
        color: var(--text-200);
      }
      .btn-secondary:hover:not(:disabled) { background: #1e293b; }

      .btn-sky-soft {
        background: rgba(14, 165, 233, 0.14);
        border: 1px solid rgba(14, 165, 233, 0.45);
        color: var(--sky-200);
      }
      .btn-sky-soft:hover:not(:disabled) { background: rgba(14, 165, 233, 0.24); }

      .btn-primary {
        background: var(--sky-500);
        color: #020617;
        font-weight: 700;
      }
      .btn-primary:hover:not(:disabled) { background: var(--sky-400); }

      /* Main Container */
      .main-container {
        width: 100%;
        max-width: 1440px;
        margin: 0 auto;
        padding: 20px 24px 36px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* Card Containers */
      .panel {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }

      .panel-pad {
        padding: 20px;
      }

      .panel-header {
        padding: 12px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .panel-title {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        color: var(--text-100);
        letter-spacing: -0.01em;
      }

      .sub-box {
        background: var(--bg-inset);
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      /* Input Section */
      .samples-strip {
        padding: 10px 18px;
        background: var(--bg-sub);
        border-bottom: 1px solid rgba(30, 41, 59, 0.8);
      }

      .samples-grid {
        margin-top: 8px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .sample-btn {
        width: 100%;
        text-align: left;
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.75);
        color: var(--text-300);
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        transition: background-color 0.15s ease, border-color 0.15s ease;
      }
      .sample-btn:hover { background: rgba(30, 41, 59, 0.7); color: var(--text-100); }
      .sample-btn.is-active {
        background: rgba(30, 41, 59, 0.95);
        border-color: rgba(14, 165, 233, 0.65);
        color: var(--text-100);
      }

      .input-workspace {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .url-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .text-input {
        width: 100%;
        min-width: 0;
        padding: 10px 12px;
        border-radius: 6px;
        background: var(--bg-inset);
        border: 1px solid var(--border);
        color: var(--text-100);
        font-size: 12px;
      }
      .text-input::placeholder, .article-textarea::placeholder {
        color: var(--text-500);
      }

      .textarea-row {
        display: flex;
        gap: 12px;
        align-items: stretch;
      }

      .article-textarea {
        flex: 1;
        width: 100%;
        min-height: 200px;
        max-height: 340px;
        resize: vertical;
        padding: 16px;
        border-radius: 6px;
        background: var(--bg-inset);
        border: 1px solid var(--border);
        color: var(--text-100);
        font-size: 14px;
        line-height: 1.65;
      }

      .analyze-cta {
        width: 190px;
        padding: 12px 16px;
        border-radius: 6px;
        font-size: 14px;
      }

      .collapsed-bar {
        padding: 10px 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      /* Grids */
      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .grid-battle {
        display: grid;
        grid-template-columns: 1.25fr 1fr;
        gap: 16px;
      }

      .grid-algo-split {
        display: grid;
        grid-template-columns: 1.25fr 1fr;
        gap: 16px;
      }

      .grid-4 {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      /* Scoreboard & Donut */
      .donut-wrap {
        position: relative;
        width: 112px;
        height: 112px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .donut-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .grade-badge {
        display: inline-flex;
        align-items: center;
        padding: 4px 12px;
        border-radius: 6px;
        border: 1px solid;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }
      .grade-aggro { background: rgba(244, 63, 94, 0.15); border-color: rgba(244, 63, 94, 0.5); color: var(--rose-200); }
      .grade-caution { background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.5); color: var(--amber-200); }
      .grade-factual { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.5); color: var(--emerald-200); }

      .kw-chip-rose {
        padding: 5px 12px;
        border-radius: 999px;
        background: rgba(244, 63, 94, 0.16);
        border: 1px solid rgba(244, 63, 94, 0.45);
        color: var(--rose-100);
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }
      .kw-chip-rose:hover { background: rgba(244, 63, 94, 0.26); }

      .kw-chip-amber {
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(245, 158, 11, 0.15);
        border: 1px solid rgba(245, 158, 11, 0.42);
        color: var(--amber-100);
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .kw-chip-amber:hover { background: rgba(245, 158, 11, 0.24); }

      /* Top 3 Facts */
      .fact-card {
        padding: 16px;
        border-radius: 8px;
        background: var(--bg-inset);
        border: 1px solid rgba(14, 165, 233, 0.35);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .fact-text {
        margin: 0;
        font-size: 17px;
        line-height: 1.6;
        font-weight: 500;
        color: var(--text-100);
        word-break: keep-all;
      }

      /* X-Ray Text */
      .xray-body {
        padding: 20px;
        font-size: 15px;
        line-height: 1.9;
        color: var(--text-300);
        white-space: pre-wrap;
        word-break: keep-all;
      }
      .seg-btn {
        display: inline;
        text-align: left;
        font-size: inherit;
        line-height: inherit;
        transition: opacity 0.15s ease;
      }
      .seg-highlight {
        border-radius: 3px;
        padding: 1px 4px;
        margin: 0 1px;
      }
      .seg-emotion {
        background: rgba(244, 63, 94, 0.2);
        color: var(--rose-100);
        border-bottom: 1px solid rgba(251, 113, 133, 0.8);
      }
      .seg-vague {
        background: rgba(245, 158, 11, 0.2);
        color: var(--amber-100);
        border-bottom: 1px solid rgba(251, 191, 36, 0.8);
      }
      .seg-fact {
        background: rgba(14, 165, 233, 0.22);
        color: #f0f9ff;
        border-bottom: 1px solid var(--sky-400);
      }
      .seg-dim { opacity: 0.24; }
      .seg-selected { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.65); }
      .seg-strike {
        text-decoration: line-through;
        opacity: 0.3;
        color: var(--text-500);
        margin: 0 1px;
      }
      .sentence-focused {
        border-radius: 4px;
        padding: 2px 6px;
        background: rgba(14, 165, 233, 0.14);
        box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.8);
      }

      /* Segmented Tabs */
      .seg-tabs {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        background: var(--bg-inset);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .seg-tab-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-400);
        white-space: nowrap;
      }
      .seg-tab-btn:hover { color: var(--text-200); }
      .seg-tab-btn.is-active {
        background: #1e293b;
        color: var(--text-100);
      }

      /* Sentence Map Tiles */
      .sent-tile {
        height: 32px;
        min-width: 42px;
        padding: 0 8px;
        border-radius: 5px;
        border: 1px solid;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
        transition: transform 0.12s ease;
      }
      .sent-tile:hover { transform: scale(1.06); }
      .sent-fact { background: rgba(14, 165, 233, 0.24); border-color: rgba(56, 189, 248, 0.7); color: #e0f2fe; }
      .sent-framing { background: rgba(244, 63, 94, 0.24); border-color: rgba(251, 113, 133, 0.7); color: var(--rose-100); }
      .sent-mixed { background: rgba(245, 158, 11, 0.24); border-color: rgba(251, 191, 36, 0.7); color: var(--amber-100); }
      .sent-neutral { background: rgba(30, 41, 59, 0.85); border-color: rgba(51, 65, 85, 0.9); color: var(--text-300); }
      .sent-tile.is-focused { box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9); }

      /* Modal */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgba(0, 0, 0, 0.78);
        backdrop-filter: blur(3px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        overflow-y: auto;
      }
      .modal-card {
        width: 100%;
        max-width: 900px;
        background: var(--bg-surface);
        border: 1px solid rgba(51, 65, 85, 0.9);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
      }
      .modal-body {
        padding: 20px;
        display: grid;
        grid-template-columns: 1fr 290px;
        gap: 24px;
        align-items: start;
      }
      .canvas-stage {
        position: relative;
        width: 100%;
        max-width: 360px;
        aspect-ratio: 4 / 5;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid rgba(51, 65, 85, 0.85);
        background: var(--bg-inset);
      }
      .carousel-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 34px;
        height: 34px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.58);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .carousel-arrow:hover:not(:disabled) { background: rgba(0, 0, 0, 0.85); }

      /* Responsive */
      @media (max-width: 1024px) {
        .grid-2, .grid-battle, .grid-algo-split, .grid-4 {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 768px) {
        .topbar { padding: 0 14px; gap: 12px; }
        .topbar-nav { display: none; }
        .main-container { padding: 14px; }
        .samples-grid { grid-template-columns: 1fr; }
        .textarea-row { flex-direction: column; }
        .analyze-cta { width: 100%; }
        .fact-card { flex-direction: column; align-items: flex-start; }
        .modal-body { grid-template-columns: 1fr; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

        function downloadStandaloneHtml() {
          var html = CLEAN_STANDALONE_HTML;
          if (!html) return;
          var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'index.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        }

        function copyTextToClipboard(text) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text).then(function () { return true; }).catch(function () { return false; });
          }
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          return Promise.resolve(ok);
        }

          } else if (state.algoTab === 'weights') {

        function renderDashboard() {
          if (!state.analysis) {
            return (
              '<div class="panel" style="padding:48px 20px;text-align:center;">' +
              '<p style="margin:0;font-size:14px;font-weight:500;color:var(--text-300);">분석할 텍스트가 없습니다.</p>' +
              '<p style="margin:6px 0 0;font-size:12px;color:var(--text-500);">상단 입력창에서 샘플을 선택하거나 뉴스 링크 또는 본문을 입력한 뒤 X-레이 해부를 시작하세요.</p>' +
              '</div>'
            );
          }

          var derived = getDerivedState();
          var metrics = derived.metrics;
          var topFacts = derived.topFacts;
          var sentenceGroups = derived.sentenceGroups;
          var gradeCls = metrics.grade === 'aggro' ? 'grade-aggro' : metrics.grade === 'factual' ? 'grade-factual' : 'grade-caution';

          var typeOptions = [
            { value: 'fact', label: '순수 팩트', color: 'var(--sky-300)' },
            { value: 'emotion', label: '감정 선동', color: 'var(--rose-300)' },
            { value: 'vague', label: '모호한 출처', color: 'var(--amber-300)' },
            { value: 'neutral', label: '일반 문맥', color: 'var(--text-300)' },
          ];

          var selectedSeg = null;
          if (state.selectedAccordionSegId) {
            for (var i = 0; i < state.analysis.segments.length; i++) {
              if (state.analysis.segments[i].id === state.selectedAccordionSegId) {
                selectedSeg = state.analysis.segments[i];
                break;
              }
            }
          }

          return (
            '<div style="display:flex;flex-direction:column;gap:16px;">' +
            (state.analyzedMeta
              ? '<div class="panel" style="padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;">' +
                '<div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;"><span style="font-size:12px;font-weight:600;color:var(--sky-400);">추출 기사</span><p style="margin:0;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(state.analyzedMeta.title) + '</p></div>' +
                '<a href="' + escapeHtml(state.analyzedMeta.url) + '" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" style="font-size:11px;padding:5px 10px;color:var(--sky-300);"><span>원본 링크 바로가기</span>' + ICONS.arrowUpRight + '</a>' +
                '</div>'

            renderTopBar() +
            '<main id="top" class="main-container">' +
            renderInputPanel() +
            renderDashboard() +
            '</main>' +
            renderInstaModal(derived);

          bindDynamicInputs();
          renderInstaCanvasIfOpen();
        }

        function runUrlExtraction(targetUrl) {
          var trimmed = String(targetUrl || '').trim();
          if (!trimmed || state.isExtracting) return;
          state.extractError = null;
          state.isExtracting = true;
          state.urlInput = trimmed;
          renderApp();

          extractNewsFromUrl(trimmed)
            .then(function (res) {
              var safeUrl = sanitizePublicHttpUrl(res.url);
              var meta = safeUrl ? { title: res.title, url: safeUrl } : null;
              state.rawText = res.content;
              state.activeSampleId = null;
              state.extractedMeta = meta;
              state.analyzedMeta = meta;
              state.analysis = analyzeKoreanFraming(res.content);
              state.focusedSentenceIndex = null;
              state.selectedAccordionSegId = null;
              state.isExtracting = false;
              renderApp();
            })
            .catch(function (err) {
              state.extractError = (err && err.message) || '본문 추출에 실패했습니다.';
              state.isExtracting = false;
              renderApp();
            });
        }

        function bindDynamicInputs() {
          var urlForm = document.getElementById('url-extract-form');
          if (urlForm) {
            urlForm.addEventListener('submit', function (e) {
              e.preventDefault();
              runUrlExtraction(state.urlInput);
            });
          }

          var urlInputEl = document.getElementById('news-url-input');
          if (urlInputEl) {
            urlInputEl.addEventListener('input', function (e) {
              state.urlInput = e.target.value;
              if (state.extractError) state.extractError = null;
              var submitBtn = urlForm ? urlForm.querySelector('button[type="submit"]') : null;
              if (submitBtn) submitBtn.disabled = state.isExtracting || !state.urlInput.trim();
            });
          }

          var rawInputEl = document.getElementById('raw-article-input');
          if (rawInputEl) {
            rawInputEl.addEventListener('input', function (e) {
              var prevHasUrl = !!isLikelyStandaloneUrl(state.rawText);
              state.rawText = e.target.value;
              var matched = findMatchingSample(state.rawText);
              state.activeSampleId = matched ? matched.id : null;
              if (matched || !state.rawText.trim()) state.extractedMeta = null;
              var nextHasUrl = !!isLikelyStandaloneUrl(state.rawText);
              if (prevHasUrl !== nextHasUrl || !state.rawText.trim()) {
                var pos = e.target.selectionStart;
                renderApp();
                var reEl = document.getElementById('raw-article-input');
                if (reEl) { reEl.focus(); reEl.setSelectionRange(pos, pos); }
              } else {
                var analyzeBtn = document.querySelector('[data-action="analyze"]');
                if (analyzeBtn) analyzeBtn.disabled = state.isExtracting || !state.rawText.trim();
              }
            });
          }

          var coverInput = document.getElementById('insta-cover-input');
          if (coverInput) {
            coverInput.addEventListener('input', function (e) {
              state.instaCoverTitle = e.target.value;
              state.instaSlideIdx = 0;
              renderInstaCanvasIfOpen();
            });
          }
        }

        /* ---------------- Delegated Click & Keyboard Handlers ---------------- */
        document.addEventListener('click', function (e) {
          var actionEl = e.target.closest ? e.target.closest('[data-action]') : null;
          if (!actionEl) return;
          var action = actionEl.getAttribute('data-action');

          if (action === 'close-insta-backdrop' && e.target !== actionEl) return;

          if (action === 'download-html') {
            downloadStandaloneHtml();
          } else if (action === 'brand-reset') {
            e.preventDefault();
            state.activeLayer = 'all';
            renderApp();
          } else if (action === 'set-layer') {
            state.activeLayer = actionEl.getAttribute('data-layer') || 'all';
            renderApp();
          } else if (action === 'reset-sample') {
            state.rawText = SAMPLE_CASES[0].text;
            state.urlInput = '';
            state.activeSampleId = SAMPLE_CASES[0].id;
            state.extractedMeta = null;
            state.analyzedMeta = null;
            state.extractError = null;
            state.isInputCollapsed = false;
            state.activeLayer = 'all';
            state.focusedSentenceIndex = null;
            state.selectedAccordionSegId = null;
            state.analysis = analyzeKoreanFraming(SAMPLE_CASES[0].text);
            renderApp();
          } else if (action === 'select-sample') {
            var sid = actionEl.getAttribute('data-sample');
            for (var i = 0; i < SAMPLE_CASES.length; i++) {
              if (SAMPLE_CASES[i].id === sid) {
                state.rawText = SAMPLE_CASES[i].text;
                state.urlInput = '';
                state.activeSampleId = sid;
                state.extractedMeta = null;
                state.analyzedMeta = null;
                state.extractError = null;
                state.focusedSentenceIndex = null;
                state.selectedAccordionSegId = null;
                state.analysis = analyzeKoreanFraming(SAMPLE_CASES[i].text);
                renderApp();
                break;
              }
            }
          } else if (action === 'expand-input') {
            state.isInputCollapsed = false;
            renderApp();
          } else if (action === 'clear-text') {
            state.rawText = '';
            state.urlInput = '';
            state.activeSampleId = null;
            state.extractedMeta = null;
            state.analyzedMeta = null;
            state.extractError = null;
            state.analysis = null;
            renderApp();
          } else if (action === 'extract-detected-url') {
            runUrlExtraction(actionEl.getAttribute('data-url'));
          } else if (action === 'analyze') {
            if (!state.rawText.trim()) return;
            state.analyzedMeta = state.extractedMeta;
            state.analysis = analyzeKoreanFraming(state.rawText);
            state.focusedSentenceIndex = null;
            state.selectedAccordionSegId = null;
            state.isInputCollapsed = true;
            renderApp();
          } else if (action === 'focus-layer') {
            state.activeLayer = actionEl.getAttribute('data-layer') || 'all';
            state.isAccordionOpen = true;
            renderApp();
          } else if (action === 'edit-fact') {
            state.editingFactId = actionEl.getAttribute('data-segid');
            renderApp();
          } else if (action === 'reclassify-fact') {
            var fId = actionEl.getAttribute('data-segid');
            var fType = actionEl.getAttribute('data-type');
            if (state.analysis && fId && fType) {
              state.analysis = reclassifySegment(state.analysis, fId, fType);
            }
            state.editingFactId = null;
            renderApp();
          } else if (action === 'copy-summary') {
            var d = getDerivedState();
            if (!d.metrics) return;
            var lines = ['[Framing X-Ray] 탈수 완료 · 핵심 팩트 TOP 3'];
            if (state.analyzedMeta && state.analyzedMeta.title) lines.push('기사: ' + state.analyzedMeta.title);
            lines.push('판정: ' + d.metrics.gradeLabel + ' | 어그로 지수 ' + d.metrics.breakdown.aggroScore + '/100점');
            lines.push('구성: 순수 팩트 ' + d.metrics.factPercent + '% · 감정 선동 ' + d.metrics.emotionPercent + '% · 모호 출처 ' + d.metrics.vaguePercent + '%');
            lines.push('');
            if (!d.topFacts.length) lines.push('검출된 뉴스 핵심 팩트가 없습니다.');
            else d.topFacts.forEach(function (ft, idx) { lines.push('0' + (idx + 1) + '. ' + ft.text.trim()); });
            if (state.analysis.blindSpots[0]) {
              lines.push('');
              lines.push('사각지대 경고: ' + state.analysis.blindSpots[0].oneLineWarning);
            }
            if (state.analyzedMeta && state.analyzedMeta.url) lines.push('원문: ' + state.analyzedMeta.url);
            copyTextToClipboard(lines.join('\n')).then(function (ok) {
              if (ok) {
                state.copiedSummary = true;
                renderApp();
                window.setTimeout(function () { state.copiedSummary = false; renderApp(); }, 2000);
              }
            });
          } else if (action === 'open-insta') {
            state.instaCoverTitle =
              (state.analyzedMeta && state.analyzedMeta.title) ||
              (state.analysis && state.analysis.headlineBattle.dryFact) ||
              '감정과 과장을 덜어낸 오늘의 팩트';
            state.instaSlideIdx = 0;
            state.isInstaModalOpen = true;
            renderApp();
          } else if (action === 'close-insta' || action === 'close-insta-backdrop') {
            state.isInstaModalOpen = false;
            renderApp();
          } else if (action === 'insta-prev') {
            state.instaSlideIdx = Math.max(0, state.instaSlideIdx - 1);
            renderApp();
          } else if (action === 'insta-next') {
            state.instaSlideIdx += 1;
            renderApp();
          } else if (action === 'insta-slide') {
            state.instaSlideIdx = parseInt(actionEl.getAttribute('data-idx') || '0', 10);
            renderApp();
          } else if (action === 'insta-theme') {
            state.instaThemeId = actionEl.getAttribute('data-theme') || 'editorial-light';
            renderApp();
          } else if (action === 'insta-save-one') {
            var cv = document.getElementById('insta-preview-canvas');
            if (cv) triggerPngDownload(cv, 'framing-xray-card-' + (state.instaSlideIdx + 1) + '.png');
          } else if (action === 'insta-save-all') {
            if (state.isExportingAll || !state.analysis) return;
            state.isExportingAll = true;
            renderApp();
            var dAll = getDerivedState();
            var allSlides = buildInstaCardSlides({
              articleMeta: state.analyzedMeta,
              metrics: dAll.metrics,
              topFacts: dAll.topFacts,
              blindSpots: state.analysis.blindSpots,
              headlineBattle: state.analysis.headlineBattle,
              customCoverTitle: state.instaCoverTitle,
            });
            var off = document.createElement('canvas');
            allSlides.forEach(function (sl, idx) {
              window.setTimeout(function () {
                renderInstaCardSlide(off, sl, allSlides.length, state.instaThemeId);
                triggerPngDownload(off, 'framing-xray-card-' + (idx + 1) + '.png');
                if (idx === allSlides.length - 1) {
                  state.isExportingAll = false;
                  renderApp();
                }
              }, idx * 240);
            });
          } else if (action === 'toggle-accordion') {
            state.isAccordionOpen = !state.isAccordionOpen;
            renderApp();
          } else if (action === 'toggle-dehydrate') {
            state.dehydrateMode = !state.dehydrateMode;
            renderApp();
          } else if (action === 'clear-sentence-focus') {
            state.focusedSentenceIndex = null;
            renderApp();
          } else if (action === 'select-seg') {
            state.selectedAccordionSegId = actionEl.getAttribute('data-segid');
            renderApp();
          } else if (action === 'reclassify-seg') {
            var sId = actionEl.getAttribute('data-segid');
            var sType = actionEl.getAttribute('data-type');
            if (state.analysis && sId && sType) {
              state.analysis = reclassifySegment(state.analysis, sId, sType);
            }
            renderApp();
          } else if (action === 'set-algo-tab') {
            state.algoTab = actionEl.getAttribute('data-tab') || 'formula';
            renderApp();
          } else if (action === 'jump-sentence') {
            var sIdx = parseInt(actionEl.getAttribute('data-sidx') || '0', 10);
            state.activeLayer = 'all';
            state.isAccordionOpen = true;
            state.focusedSentenceIndex = sIdx;
            renderApp();
            window.setTimeout(function () {
              var el = document.getElementById('xray-sent-' + sIdx);
              if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 60);
          }
        });

        document.addEventListener('keydown', function (e) {
          if (!state.isInstaModalOpen) return;
          if (e.key === 'Escape') {
            state.isInstaModalOpen = false;
            renderApp();
          }
        });

        renderApp();
      })();
    </script></body></html>
